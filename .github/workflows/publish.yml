name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          path = Path("pyproject.toml")
          text = path.read_text()
          pattern = r'(?m)^version\\s*=\\s*[\"\\\']([^\"\\\']+)[\"\\\']'
          match = re.search(pattern, text)
          if not match:
              raise SystemExit("version field not found in pyproject.toml")
          current = match.group(1)
          if current == version:
              print(f"Package version already set to {version}")
          else:
              updated = re.sub(pattern, f'version = \"{version}\"', text, count=1)
              path.write_text(updated)
              print(f"Set package version to {version}")
          PY

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
